<image>
<<include etc/image.conf>>

# dimensions of the image
size = 2000p

# background color
background = white

# background image
# background_image = file.png

# quality of image, when saved as PNG
auto_alpha_colors = yes
auto_alpha_steps = 5
anti_aliasing = yes

</image>

<colors>
<<include etc/colors.conf>>

# color for tracks
track = white

# color for background of tracks
track_background = vvlgrey

# color for text
text = black

# color for axis ticks
axes = black

# color for grid lines
grid = vvlgrey

</colors>

<fonts>
<<include etc/fonts.conf>>

# font for text
font = default

# font size
font_size = 12p

</fonts>

<plots>
<<include etc/plots.conf>>

# type of plot
type = histogram

# orientation of plot
orientation = out

# thickness of plot
thickness = 20p

</plots>

<rules>
<<include etc/rules.conf>>

# zoom in on specific regions
z = 1:20

# set the minimum value
min = 0

# set the maximum value
max = 100

# set the fill color for plots
fill_color = blue

</rules>
